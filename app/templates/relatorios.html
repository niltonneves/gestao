{% extends "base.html" %}
{% block title %}Relatórios – N7 Gestão{% endblock %}

{% block content %}
<h4 class="mb-3">Relatórios</h4>

<div class="row g-3">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5><i class="bi bi-file-earmark-excel me-2"></i>Orçamentos</h5>
        <p class="mb-2">Relatório em Excel com orçamentos por período.</p>
        <a href="{{ url_for('relatorios.excel_orcamentos') }}" class="btn btn-success btn-sm">Gerar Excel</a>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5><i class="bi bi-file-earmark-pdf me-2"></i>Orçamentos</h5>
        <p class="mb-2">Relatório em PDF de um orçamento.</p>
        <a href="{{ url_for('relatorios.pdf_orcamento', orcamento_id=1) }}" class="btn btn-danger btn-sm">Gerar PDF</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

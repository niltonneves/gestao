{% extends "base.html" %}
{% block title %}{% if edicao %}Editar{% else %}Novo{% endif %} Registro Financeiro – N7 Gestão{% endblock %}

{% block content %}
<div class="card" style="max-width: 900px;">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>{% if edicao %}Editar Registro Financeiro{% else %}Novo Registro Financeiro{% endif %}</span>
    <a href="{{ url_for('financeiro.listar') }}" class="btn btn-sm btn-outline-secondary">Voltar</a>
  </div>
  <div class="card-body">
    <form method="post" action="{% if edicao %}{{ url_for('financeiro.editar', registro_id=registro.id) }}{% else %}{{ url_for('financeiro.criar') }}{% endif %}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Cliente *</label>
          <select class="form-select" name="cliente_id" required>
            <option value="">Selecione...</option>
            {% for c in clientes %}
            <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Orçamento vinculado</label>
          <select class="form-select" name="orcamento_id">
            <option value="">--</option>
            {% for o in orcamentos %}
            <option value="{{ o.id }}">{{ "%05d"|format(o.numero) }} – {{ o.cliente.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Ordem de serviço vinculada</label>
          <select class="form-select" name="ordem_servico_id">
            <option value="">--</option>
            {% for o in ordens %}
            <option value="{{ o.id }}">{{ o.numero_exibicao }} – {{ o.cliente.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select class="form-select" name="tipo">
            <option value="entrada" {% if not edicao or registro.tipo == 'entrada' %}selected{% endif %}>Entrada</option>
            <option value="saida" {% if edicao and registro.tipo == 'saida' %}selected{% endif %}>Saída</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Valor (R$)</label>
          <input type="number" step="0.01" class="form-control" name="valor" value="{{ registro.valor if edicao else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            <option value="pendente" {% if not edicao or registro.status == 'pendente' %}selected{% endif %}>Pendente</option>
            <option value="parcialmente_pago" {% if edicao and registro.status == 'parcialmente_pago' %}selected{% endif %}>Parcialmente pago</option>
            <option value="pago" {% if edicao and registro.status == 'pago' %}selected{% endif %}>Pago</option>
            <option value="atrasado" {% if edicao and registro.status == 'atrasado' %}selected{% endif %}>Atrasado</option>
            <option value="cancelado" {% if edicao and registro.status == 'cancelado' %}selected{% endif %}>Cancelado</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Forma de pagamento</label>
          <input type="text" class="form-control" name="forma_pagamento" value="{{ registro.forma_pagamento if edicao else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Parcelas</label>
          <input type="number" class="form-control" name="parcelas" value="{{ registro.parcelas if edicao else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Descrição</label>
          <input type="text" class="form-control" name="descricao" value="{{ registro.descricao if edicao else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Observações</label>
          <textarea class="form-control" name="observacoes" rows="2">{{ registro.observacoes if edicao else '' }}</textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('financeiro.listar') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

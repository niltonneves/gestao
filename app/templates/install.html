<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instalação – N7 Gestão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 720px;">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0"><i class="bi bi-gear me-2"></i>Instalação – N7 Gestão</h4>
      </div>
      <div class="card-body">
        <p class="mt-3">Esta tela irá configurar a empresa e o administrador inicial.</p>
        <form method="post" action="{{ url_for('install.executar') }}">
          <h5>Empresa</h5>
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label">Razão social *</label>
              <input type="text" class="form-control" name="razao_social" required>
            </div>
            <div class="col-6">
              <label class="form-label">Nome fantasia</label>
              <input type="text" class="form-control" name="nome_fantasia">
            </div>
            <div class="col-6">
              <label class="form-label">CPF/CNPJ</label>
              <input type="text" class="form-control" name="cpf_cnpj">
            </div>
            <div class="col-12">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control" name="endereco">
            </div>
            <div class="col-4">
              <label class="form-label">CEP</label>
              <input type="text" class="form-control" name="cep">
            </div>
            <div class="col-4">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" name="telefone">
            </div>
            <div class="col-4">
              <label class="form-label">WhatsApp</label>
              <input type="text" class="form-control" name="whatsapp">
            </div>
            <div class="col-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" name="email">
            </div>
            <div class="col-6">
              <label class="form-label">Site</label>
              <input type="text" class="form-control" name="site">
            </div>
            <div class="col-6">
              <label class="form-label">Responsável</label>
              <input type="text" class="form-control" name="responsavel">
            </div>
            <div class="col-6">
              <label class="form-label">Banco</label>
              <input type="text" class="form-control" name="banco">
            </div>
            <div class="col-6">
              <label class="form-label">Chave PIX</label>
              <input type="text" class="form-control" name="chave_pix">
            </div>
            <div class="col-12">
              <label class="form-label">Observações</label>
              <textarea class="form-control" name="observacoes" rows="2"></textarea>
            </div>
          </div>

          <hr>

          <h5>Administrador inicial</h5>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Nome do administrador *</label>
              <input type="text" class="form-control" name="admin_nome" value="Administrador" required>
            </div>
            <div class="col-6">
              <label class="form-label">E-mail do administrador *</label>
              <input type="email" class="form-control" name="admin_email" type="email" value="admin@empresa.com" required>
            </div>
            <div class="col-6">
              <label class="form-label">Senha *</label>
              <input type="password" class="form-control" name="admin_senha" value="123456" required>
            </div>
            <div class="col-6">
              <label class="form-label">Confirmar senha *</label>
              <input type="password" class="form-control" name="admin_confirmar" value="123456" required>
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-primary" type="submit">Instalar sistema</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
